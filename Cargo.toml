[package]
name = "dbclient"
version = "0.4.3"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
toml = "0.8.23"

iocraft = "0.8"

chrono = "0.4"
prost = "0.14"
prost-types = "0.14"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"

#db clients
redis = { version = "0.31" }
tokio-postgres = "0.7"

[build-dependencies]
prost-build = "0.14"

[profile.dev]
opt-level = 0
debug = 2
