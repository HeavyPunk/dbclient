syntax = "proto3";

package dbclient.objects;

import "connections.proto";
import "common.proto";

service ObjectsService {
  rpc GetObjectsOfConnection(GetObjectsOfConnectionRequest) returns (GetObjectsOfConnectionResponse);
  rpc AddObjectToConnection(AddObjectToConnectionRequest) returns (AddObjectToConnectionResponse);
  rpc GetObjectOfDecriptor(GetObjectOfDecriptorRequest) returns (GetObjectOfDecriptorResponse);
}

message GetObjectsOfConnectionRequest {
  connections.Connection connection = 1;
}

message GetObjectsOfConnectionResponse {
  repeated common.DbObject objects = 1;
}

message AddObjectToConnectionRequest {
  connections.Connection connection = 1;
  common.DbObjectDescriptor destination = 2;
  common.DbObject object = 3;
}

message AddObjectToConnectionResponse {
}

message GetObjectOfDecriptorRequest {
  connections.Connection connection = 1;
  common.DbObjectDescriptor descriptor = 2;
}

message GetObjectOfDecriptorResponse {
  common.DbObject object = 3;
}


