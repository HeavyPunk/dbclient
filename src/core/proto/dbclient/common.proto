syntax = "proto3";

package dbclient.common;

import "postgresql.proto";
import "redis.proto";


message DbRecord {
  oneof specification {
    postgresql.PostgresRecord postgres = 1;
  }
}

message DbObject {
  oneof specification {
    postgresql.PostgresObject postgres = 1;
    redis.RedisObject redis = 2;
  };
}

message DbObjectDescriptor {
  oneof descriptor {
    postgresql.PostgresObjectDescriptor postgres = 1;
  }
}

message DbField {
  oneof field {
    postgresql.PostgresField postgres = 1;
  }
}
